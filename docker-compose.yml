version: "3.8"

services:
  app1:
    build: .
    expose:
      - "8080"
  app2:
    build: .
    expose:
      - "8080"
  app3:
    build: .
    expose:
      - "8080"

  # Настройка балансировщика nginx
  nginx_balancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
      - app3

  # Сервер сбора метрик
  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Система визуализации графиков
  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
